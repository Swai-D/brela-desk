<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BRELA Desk</title>
<link href="assets/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/icons.min.css" rel="stylesheet"><link href="assets/css/app.min.css" rel="stylesheet"><link href="assets/css/brela.css" rel="stylesheet"></head>
<body style="background:linear-gradient(135deg,#1c84ee,#5b73e8)"><div class="d-flex align-items-center justify-content-center min-vh-100 p-3"><div class="card" style="width:100%;max-width:400px"><div class="card-body p-4">
<div class="text-center mb-4"><img src="assets/images/logo-sm.svg" height="36"><h4 class="mt-2">BRELA Desk</h4><p class="text-muted mb-0">Sign in to manage your cases</p></div>
<form id="login" novalidate><label class="form-label">Email</label><input id="em" name="email" type="email" class="form-control mb-3" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"><label class="form-label">Password</label><div class="input-group mb-3"><input id="pw" name="password" type="password" class="form-control" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go"><button type="button" id="eye" class="btn btn-light" tabindex="-1" title="Show / hide password"><i class="bx bx-show"></i></button></div>
<div id="err" class="text-danger mb-2"></div><button type="submit" id="go" class="btn btn-primary w-100">Sign in</button></form></div></div></div>
<script>const go=async()=>{err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});const j=await r.json();if(!r.ok)throw new Error(j.error);location.href='index.html'}catch(e){err.textContent=e.message}};
document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();go()});eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.firstChild.className='bx '+(pw.type==='password'?'bx-show':'bx-hide')};pw.oninput=()=>{if(err.textContent)err.textContent=''};em.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();pw.focus()}};fetch('/api/me').then(r=>r.ok&&(location.href='index.html'))</script></body></html>
