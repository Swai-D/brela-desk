<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BRELA Desk</title>
<link href="assets/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/icons.min.css" rel="stylesheet"><link href="assets/css/app.min.css" rel="stylesheet"><link href="assets/css/brela.css" rel="stylesheet"></head>
<body style="background:linear-gradient(135deg,#1c84ee,#5b73e8)"><div class="d-flex align-items-center justify-content-center min-vh-100 p-3"><div class="card" style="width:100%;max-width:400px"><div class="card-body p-4">
<div class="text-center mb-4"><img src="assets/images/logo-sm.svg" height="36"><h4 class="mt-2">BRELA Desk</h4><p class="text-muted mb-0">Sign in to manage your cases</p></div>
<label class="form-label">Email</label><input id="em" type="email" class="form-control mb-3" autocomplete="username"><label class="form-label">Password</label><input id="pw" type="password" class="form-control mb-3" autocomplete="current-password">
<div id="err" class="text-danger mb-2"></div><button id="go" class="btn btn-primary w-100">Sign in</button></div></div></div>
<script>const go=async()=>{err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});const j=await r.json();if(!r.ok)throw new Error(j.error);location.href='index.html'}catch(e){err.textContent=e.message}};
go_=document.getElementById('go');go_.onclick=go;pw.onkeydown=e=>e.key==='Enter'&&go();fetch('/api/me').then(r=>r.ok&&(location.href='index.html'))</script></body></html>
